<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចាប់ប្រធានបទ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { 
            font-family: 'Kantumruy Pro', -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 1rem; 
            margin: 0; 
            min-height: 100vh; 
        }
        .container { max-width: 600px; width: 100%; text-align: center; padding-bottom: 100px; }
        h1 { font-size: 1.8rem; color: var(--primary); letter-spacing: 1px; margin-bottom: 2rem; }
        .inputs { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1.5rem; }
        .input-group { text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; opacity: 0.8; color: var(--primary); }
        textarea { 
            width: 100%; height: 110px; padding: 12px; border-radius: 12px; 
            border: 1px solid #334155; background: var(--card-bg); color: white; 
            font-size: 16px; resize: none; box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif;
        }
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
        button { 
            flex: 2; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; 
            border: none; padding: 1rem; font-size: 1rem; font-weight: bold; 
            border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            font-family: 'Kantumruy Pro', sans-serif;
        }
        #shareBtn { flex: 1; background: #334155; display: none; }
        #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 2rem; width: 100%; }
        .card { height: 190px; perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; padding: 10px; box-sizing: border-box; }
        .card-front { background: #1e293b; border: 2px dashed #475569; color: var(--primary); font-size: 2.5rem; }
        .card-back { background-color: #ffffff; color: #0f172a; transform: rotateY(180deg); border: 2px solid #e2e8f0; }
        .group-name { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; font-weight: bold; }
        .topic-text { font-weight: 700; font-size: 1.1rem; text-align: center; color: #1e293b; }
        .shuffling { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, 1px); } }
        footer { padding: 20px; font-size: 0.85rem; text-align: center; width: 100%; position: fixed; bottom: 0; left: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px); }
        footer strong { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>ចាប់ប្រធានបទ</h1>
    <div id="setupArea">
        <div class="inputs">
            <div class="input-group">
                <label>បញ្ជីឈ្មោះក្រុម (មួយក្រុមក្នុងមួយជួរ)</label>
                <textarea id="groupsInput" placeholder="ឧទាហរណ៍៖&#10;ក្រុមទី១&#10;ក្រុមទី២"></textarea>
            </div>
            <div class="input-group">
                <label>បញ្ជីប្រធានបទ (មួយប្រធានបទក្នុងមួយជួរ)</label>
                <textarea id="topicsInput" placeholder="ឧទាហរណ៍៖&#10;ប្រវត្តិវិទ្យា&#10;វិទ្យាសាស្ត្រ"></textarea>
            </div>
        </div>
        <div class="btn-row">
            <button onclick="runAssignment()">ចាប់ផ្តើមចាប់ឆ្នោត</button>
            <button id="shareBtn" onclick="copyShareLink()">ចម្លងតំណភ្ជាប់លទ្ធផល</button>
        </div>
    </div>
    <div id="results"></div>
</div>

<footer>បង្កើតដោយ <strong>Valen RIN</strong></footer>

<script>
    let currentPairs = [];

    // Decodes the URL on page load
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const sharedData = urlParams.get('s');
        if (sharedData) {
            try {
                // Correctly decodes Base64 even with Khmer/Unicode characters
                const decoded = decodeURIComponent(escape(atob(sharedData)));
                const pairs = decoded.split('|').map(item => {
                    const [group, topic] = item.split(':');
                    return { group, topic };
                });
                displayResults(pairs, true);
                document.getElementById('setupArea').style.display = 'none';
            } catch (e) { 
                console.error("Link error", e); 
            }
        }
    };

    function runAssignment() {
        const groups = document.getElementById('groupsInput').value.split('\n').filter(g => g.trim() !== "");
        let topics = document.getElementById('topicsInput').value.split('\n').filter(t => t.trim() !== "");
        
        if (groups.length === 0 || topics.length < groups.length) {
            return alert("សូមពិនិត្យមើលបញ្ជីឈ្មោះក្រុម និងប្រធានបទឡើងវិញ!");
        }

        const shuffledTopics = [...topics].sort(() => Math.random() - 0.5);
        currentPairs = groups.map((g, i) => ({ group: g, topic: shuffledTopics[i] }));
        displayResults(currentPairs, false);
        document.getElementById('shareBtn').style.display = 'block';
    }

    function displayResults(pairs, isShared) {
        const container = document.getElementById('results');
        container.innerHTML = '';
        pairs.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card' + (isShared ? '' : ' shuffling');
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">?</div>
                    <div class="card-back">
                        <div class="group-name">${p.group}</div>
                        <div class="topic-text">${p.topic}</div>
                    </div>
                </div>`;
            container.appendChild(card);
        });
        setTimeout(() => {
            document.querySelectorAll('.card').forEach((c, i) => {
                c.classList.remove('shuffling');
                setTimeout(() => c.classList.add('flipped'), i * 250);
            });
        }, isShared ? 100 : 1200);
    }

    // Creates the Base64 link
    function copyShareLink() {
        if (currentPairs.length === 0) return;
        const compactString = currentPairs.map(p => `${p.group}:${p.topic}`).join('|');
        
        // This method turns the text into a shorter Base64 string
        const encoded = btoa(unescape(encodeURIComponent(compactString)));
        
        const url = window.location.origin + window.location.pathname + '?s=' + encoded;
        navigator.clipboard.writeText(url).then(() => alert("តំណភ្ជាប់លទ្ធផលត្រូវបានចម្លង!"));
    }
</script>
</body>
</html>
