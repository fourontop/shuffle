<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចាប់ប្រធានបទ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --accent: #f59e0b; }
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 1rem; margin: 0; min-height: 100vh; }
        .container { max-width: 600px; width: 100%; text-align: center; padding-bottom: 120px; }
        h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 2rem; }
        
        /* Setup Area */
        .inputs { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1.5rem; }
        .input-group { text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; opacity: 0.8; color: var(--primary); }
        textarea { width: 100%; height: 100px; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: var(--card-bg); color: white; font-size: 16px; resize: none; box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
        
        /* The Stage (Single Result Display) */
        #stage { display: none; margin-top: 2rem; padding: 2rem; background: var(--card-bg); border-radius: 20px; border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(139, 92, 246, 0.2); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .stage-label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; }
        .stage-group { font-size: 2rem; font-weight: 700; margin-bottom: 15px; }
        .stage-divider { height: 2px; width: 50px; background: var(--primary); margin: 15px auto; }
        .stage-topic { font-size: 1.5rem; color: #ffffff; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; }

        /* Controls */
        .btn-row { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        button { padding: 1rem 2rem; font-size: 1rem; font-weight: bold; border-radius: 12px; cursor: pointer; font-family: 'Kantumruy Pro', sans-serif; border: none; transition: 0.3s; }
        .primary-btn { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; flex: 2; }
        .secondary-btn { background: #334155; color: white; flex: 1; }
        
        /* Stats */
        #stats { margin-top: 20px; font-size: 0.8rem; opacity: 0.6; }

        footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; padding: 20px 0; font-size: 0.85rem; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        footer strong { color: var(--primary); margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ចាប់ប្រធានបទ</h1>
    
    <div id="setupArea">
        <div class="inputs">
            <div class="input-group">
                <label>បញ្ជីឈ្មោះក្រុម</label>
                <textarea id="groupsInput" placeholder="ក្រុមទី១&#10;ក្រុមទី២"></textarea>
            </div>
            <div class="input-group">
                <label>បញ្ជីប្រធានបទ</label>
                <textarea id="topicsInput" placeholder="ប្រធានបទ A&#10;ប្រធានបទ B"></textarea>
            </div>
        </div>
        <button class="primary-btn" onclick="initShuffle()">រៀបចំការចាប់ឆ្នោត</button>
    </div>

    <div id="stage">
        <div class="stage-label">លទ្ធផលបច្ចុប្បន្ន</div>
        <div id="displayGroup" class="stage-group">---</div>
        <div class="stage-divider"></div>
        <div id="displayTopic" class="stage-topic">---</div>
        
        <div class="btn-row">
            <button id="nextBtn" class="primary-btn" onclick="drawNext()">ចាប់យកបន្ទាប់</button>
            <button class="secondary-btn" onclick="resetAll()">កំណត់ឡើងវិញ</button>
        </div>
        <div id="stats"></div>
    </div>
</div>

<footer>បង្កើតដោយ <strong>Valen RIN</strong></footer>

<script>
    let remainingGroups = [];
    let remainingTopics = [];
    let results = [];

    function initShuffle() {
        const gIn = document.getElementById('groupsInput').value.split('\n').filter(g => g.trim() !== "");
        const tIn = document.getElementById('topicsInput').value.split('\n').filter(t => t.trim() !== "");
        
        if (gIn.length === 0 || tIn.length < gIn.length) {
            return alert("ចំនួនប្រធានបទត្រូវតែស្មើ ឬច្រើនជាងចំនួនក្រុម!");
        }

        remainingGroups = [...gIn].sort(() => Math.random() - 0.5);
        remainingTopics = [...tIn].sort(() => Math.random() - 0.5);
        
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('stage').style.display = 'block';
        updateStats();
    }

    function drawNext() {
        if (remainingGroups.length === 0) return;

        const group = remainingGroups.pop();
        const topic = remainingTopics.pop();
        
        // Animation effect
        const gEl = document.getElementById('displayGroup');
        const tEl = document.getElementById('displayTopic');
        
        gEl.innerText = group;
        tEl.innerText = topic;
        
        // Disable button if finished
        if (remainingGroups.length === 0) {
            document.getElementById('nextBtn').innerText = "ចប់សព្វគ្រប់";
            document.getElementById('nextBtn').style.opacity = "0.5";
            document.getElementById('nextBtn').disabled = true;
        }
        
        updateStats();
    }

    function updateStats() {
        document.getElementById('stats').innerText = `នៅសល់: ${remainingGroups.length} ក្រុម`;
    }

    function resetAll() {
        if (confirm("តើអ្នកពិតជាចង់កំណត់ឡើងវិញមែនទេ?")) {
            location.reload();
        }
    }
</script>
</body>
</html>
