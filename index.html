<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចាប់ប្រធានបទ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --success: #10b981; }
        body { font-family: 'Kantumruy Pro', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 1rem; margin: 0; min-height: 100vh; }
        .container { max-width: 600px; width: 100%; text-align: center; padding-bottom: 120px; }
        h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 2rem; }
        .inputs { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1.5rem; }
        .input-group { text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; opacity: 0.8; color: var(--primary); }
        textarea { width: 100%; height: 110px; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: var(--card-bg); color: white; font-size: 16px; resize: none; box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 2; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; border: none; padding: 1rem; font-size: 1rem; font-weight: bold; border-radius: 12px; cursor: pointer; font-family: 'Kantumruy Pro', sans-serif; transition: all 0.3s; }
        #shareBtn { flex: 1; background: #334155; display: none; }
        button.copy-success { background: var(--success) !important; }
        #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 2rem; width: 100%; }
        
        .card { height: 190px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 15px; padding: 10px; box-sizing: border-box; }
        .card-front { background: #1e293b; border: 2px solid #475569; color: var(--text); }
        .card-back { background-color: #ffffff; color: #0f172a; transform: rotateY(180deg); border: 2px solid #e2e8f0; }
        
        .card-front .group-label { font-size: 0.7rem; opacity: 0.6; margin-bottom: 5px; }
        .card-front .group-target { font-weight: bold; font-size: 1rem; color: var(--primary); }
        .group-name { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; font-weight: bold; }
        .topic-text { font-weight: 700; font-size: 1.1rem; text-align: center; color: #1e293b; }

        footer { 
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 600px; padding: 20px 0; font-size: 0.85rem; 
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); 
            text-align: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100;
        }
        footer strong { color: var(--primary); margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="mainTitle">ចាប់ប្រធានបទ</h1>
    <div id="setupArea">
        <div class="inputs">
            <div class="input-group">
                <label>បញ្ជីឈ្មោះក្រុម</label>
                <textarea id="groupsInput" placeholder="បញ្ចូលឈ្មោះក្រុម..."></textarea>
            </div>
            <div class="input-group">
                <label>បញ្ជីប្រធានបទ</label>
                <textarea id="topicsInput" placeholder="បញ្ចូលប្រធានបទ..."></textarea>
            </div>
        </div>
        <div class="btn-row">
            <button onclick="runAssignment()">ចាប់ផ្តើមចាប់ឆ្នោត</button>
            <button id="shareBtn" onclick="copyShareLink()">ចម្លងតំណភ្ជាប់</button>
        </div>
    </div>
    <div id="results"></div>
</div>

<footer>បង្កើតដោយ <strong>Valen RIN</strong></footer>

<script>
    let currentPairs = [];

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const s = urlParams.get('s');
        if (s) {
            try {
                document.getElementById('mainTitle').innerText = "លទ្ធផលនៃការចាប់ឆ្នោត (Results)";
                const binary = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const decoded = new TextDecoder().decode(bytes);
                const pairs = decoded.split('|').map(item => {
                    const [group, topic] = item.split(':');
                    return { group, topic };
                });
                displayResults(pairs, true);
                document.getElementById('setupArea').style.display = 'none';
            } catch (e) { console.error("Link error", e); }
        }
    };

    function runAssignment() {
        const gIn = document.getElementById('groupsInput').value.split('\n').filter(g => g.trim() !== "");
        const tIn = document.getElementById('topicsInput').value.split('\n').filter(t => t.trim() !== "");
        if (gIn.length === 0 || tIn.length < gIn.length) return alert("សូមពិនិត្យមើលបញ្ជីឡើងវិញ!");
        
        const shuffled = [...tIn].sort(() => Math.random() - 0.5);
        currentPairs = gIn.map((g, i) => ({ group: g, topic: shuffled[i] }));
        displayResults(currentPairs, false);
        document.getElementById('shareBtn').style.display = 'block';
    }

    function displayResults(pairs, isShared) {
        const container = document.getElementById('results');
        container.innerHTML = '';
        pairs.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            // Click to reveal individual card
            card.onclick = function() { this.classList.toggle('flipped'); };
            
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="group-label">ចុចដើម្បីមើលប្រធានបទ</div>
                        <div class="group-target">${p.group}</div>
                    </div>
                    <div class="card-back">
                        <div class="group-name">${p.group}</div>
                        <div class="topic-text">${p.topic}</div>
                    </div>
                </div>`;
            container.appendChild(card);
        });
    }

    function copyShareLink() {
        if (currentPairs.length === 0) return;
        const str = currentPairs.map(p => `${p.group}:${p.topic}`).join('|');
        const bytes = new TextEncoder().encode(str);
        let binary = "";
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        const encoded = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const url = window.location.origin + window.location.pathname + '?s=' + encoded;
        navigator.clipboard.writeText(url);
        const btn = document.getElementById('shareBtn');
        btn.innerHTML = "✔ ចម្លងរួចរាល់!";
        btn.classList.add('copy-success');
        setTimeout(() => { btn.innerText = "ចម្លងតំណភ្ជាប់"; btn.classList.remove('copy-success'); }, 2000);
    }
</script>
</body>
</html>
