<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចាប់ប្រធានបទ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --success: #10b981; }
        
        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            width: 90%; 
            text-align: center; 
            padding: 2rem 0 150px 0; 
        }

        h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 2rem; }
        
        .inputs { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; opacity: 0.8; color: var(--primary); text-align: left; }
        
        textarea { 
            width: 100%; height: 100px; padding: 12px; border-radius: 12px; 
            border: 1px solid #334155; background: var(--card-bg); color: white; 
            font-size: 16px; resize: none; box-sizing: border-box; 
            font-family: 'Kantumruy Pro', sans-serif; 
        }
        
        .btn-row { display: flex; gap: 10px; margin-top: 20px; width: 100%; justify-content: center; }
        
        button { 
            padding: 1rem 1.5rem; font-size: 1rem; font-weight: bold; border-radius: 12px; 
            cursor: pointer; font-family: 'Kantumruy Pro', sans-serif; border: none; transition: 0.3s; 
        }
        
        .draw-btn { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; flex: 2; }
        .draw-btn:disabled { background: #334155; cursor: not-allowed; opacity: 0.5; }
        .reset-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; flex: 1; }

        #results { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
            margin-top: 2rem; 
            width: 100%; 
        }
        
        /* Fixed Card Styling */
        .card { 
            height: 180px; 
            background: white; 
            border-radius: 15px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
            box-sizing: border-box; 
            color: #0f172a; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: cardAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardAppear {
            from { transform: translateY(30px) scale(0.5); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .group-name { font-size: 0.75rem; color: #64748b; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; }
        .topic-text { font-weight: 700; font-size: 1.1rem; text-align: center; line-height: 1.4; }

        /* ABSOLUTE CENTER FOOTER */
        footer { 
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%;
            padding: 20px 0; 
            font-size: 0.85rem; 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(10px); 
            text-align: center; 
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
        }
        footer strong { color: var(--primary); margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">ចាប់ប្រធានបទ</h1>
    
    <div id="setupArea">
        <div class="inputs">
            <div class="input-group">
                <label>បញ្ជីឈ្មោះក្រុម</label>
                <textarea id="groupsInput" placeholder="បញ្ចូលឈ្មោះក្រុម..."></textarea>
            </div>
            <div class="input-group">
                <label>បញ្ជីប្រធានបទ</label>
                <textarea id="topicsInput" placeholder="បញ្ចូលប្រធានបទ..."></textarea>
            </div>
        </div>
        <button class="draw-btn" style="width: 100%;" onclick="startShuffle()">រៀបចំការចាប់ឆ្នោត</button>
    </div>

    <div id="playArea" style="display: none;">
        <div class="btn-row">
            <button id="drawBtn" class="draw-btn" onclick="drawOneCard()">ចាប់យកមួយសន្លឹក</button>
            <button class="reset-btn" onclick="location.reload()">កំណត់ឡើងវិញ</button>
        </div>
        <div id="results"></div>
    </div>
</div>

<footer>បង្កើតដោយ <strong>Valen RIN</strong></footer>

<script>
    let deck = [];

    function startShuffle() {
        const gIn = document.getElementById('groupsInput').value.split('\n').filter(g => g.trim() !== "");
        const tIn = document.getElementById('topicsInput').value.split('\n').filter(t => t.trim() !== "");
        
        if (gIn.length === 0 || tIn.length < gIn.length) {
            return alert("ចំនួនប្រធានបទត្រូវតែស្មើ ឬច្រើនជាងចំនួនក្រុម!");
        }

        // Title Change
        document.getElementById('title').innerText = "លទ្ធផលនៃការចាប់ឆ្នោត";

        // Shuffle logic
        const shuffledGroups = [...gIn].sort(() => Math.random() - 0.5);
        const shuffledTopics = [...tIn].sort(() => Math.random() - 0.5);
        
        deck = shuffledGroups.map((g, i) => ({ group: g, topic: shuffledTopics[i] }));
        
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('playArea').style.display = 'block';
    }

    function drawOneCard() {
        if (deck.length === 0) return;

        const pair = deck.shift();
        const container = document.getElementById('results');
        
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        cardDiv.innerHTML = `
            <div class="group-name">${pair.group}</div>
            <div class="topic-text">${pair.topic}</div>
        `;
        
        // Adds the new card at the beginning of the grid
        container.insertBefore(cardDiv, container.firstChild);

        if (deck.length === 0) {
            const btn = document.getElementById('drawBtn');
            btn.innerText = "អស់ហើយ ✔";
            btn.disabled = true;
        }
    }
</script>
</body>
</html>
